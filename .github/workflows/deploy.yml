name: Deploy to GitHub Pages

# Actions are pinned to their full commit SHA (what GitHub serves as the
# immutable reference; a mutable v-tag is forgeable by the repo owner), with
# the version kept as the trailing comment. Bump both together:
#   gh api repos/<owner>/<action>/commits/<tag> --jq .sha

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  build:
    name: Build blog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Enable Corepack
        # Before setup-node: its `cache: yarn` resolves `yarn` in the project
        # right away, and without the shims the runner's yarn 1.22 refuses on
        # packageManager ("yarn@4.18.0"). With corepack active, setup-node v7
        # caches `yarn config get cacheFolder` for berry.
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable && corepack prepare yarn@4.18.0 --activate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable
      - name: Install Playwright browsers
        # The project's own playwright (1.64.0); the build renders the
        # Mermaid and Excalidraw diagrams with it (node tools/excalidraw/export.mjs)
        # before astro build (package.json: prebuild).
        run: yarn playwright install --with-deps chromium
      - name: Build website
        run: yarn build:nodemo

      # ITHINGS_NO_DEMO=1 drops the demo entries (content.config.ts); the
      # Pages deployment is always the non-demo build, never the demo one.
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-nodemo

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1